version: 2
updates:
  # Keep the GitHub Actions used by .github/workflows/*.yml up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # validation/requirements.txt pins every dependency of the validation
  # notebook (including pyModeS, the independent reference decoder used
  # to cross-check adsblib's output) — keep them current.
  - package-ecosystem: "pip"
    directory: "/validation"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
