name: Docs

on:
  push:
    branches: [main]
    paths:
      - "adsblib.h"
      - "adsblib.c"
      - "README.md"
      - "Doxyfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          # The hosted runner may include Google's Chrome repository. Its
          # rotating index can fail apt-get update independently of Doxygen.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname '*google*' -o -iname '*chrome*' \) -delete
          sudo rm -f /var/lib/apt/lists/*google* /var/lib/apt/lists/*chrome*
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
